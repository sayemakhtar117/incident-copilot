server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: incident-copilot
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/incident_copilot}
  # Only used by the optional -Paws build (AWS SSM Parameter Store). Harmless otherwise.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mongo:
      enabled: false

copilot:
  # Chat model: any OpenAI-compatible endpoint with tool calling (Groq free tier by default).
  # Leave api-key empty to run fully offline with the built-in rule-based analyst.
  llm:
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:llama-3.3-70b-versatile}
    timeout-seconds: 30
    max-tool-iterations: 4
  # Embeddings: any OpenAI-compatible /embeddings endpoint (Gemini free tier by default).
  # Leave api-key empty to use the local hashing embedder (no network, no key).
  embedding:
    base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
  store:
    type: ${STORE_TYPE:memory}   # memory | mongo
    persistence-enabled: ${MONGO_PERSISTENCE_ENABLED:true}
    collection: incidents
    index-name: incident_vector_index
  cors:
    # Comma-separated exact browser origins allowed to call /api.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    admin-email: ${AUTH_ADMIN_EMAIL:}
    admin-password-hash: ${AUTH_ADMIN_PASSWORD_HASH:}
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:}
  rag:
    top-k: 4
    min-score: 0.05
