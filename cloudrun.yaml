apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: incident-copilot
  annotations:
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 300
      containers:
        - image: docker.io/sayem117/incident-copilot:latest
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: STORE_TYPE
              value: memory
            - name: MONGO_PERSISTENCE_ENABLED
              value: "false"
            # To enable MongoDB persistence instead:
            # - name: STORE_TYPE
            #   value: mongo
            # - name: MONGO_PERSISTENCE_ENABLED
            #   value: "true"
            # - name: MONGODB_URI
            #   valueFrom:
            #     secretKeyRef:
            #       name: incident-copilot-mongodb-uri
            #       key: "1"
            - name: CORS_ALLOWED_ORIGINS
              value: https://incidentpilot.in
