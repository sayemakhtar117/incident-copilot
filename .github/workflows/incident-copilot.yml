# This workflow is triggered on pull requests and pushes to the main branch, as well as manually via workflow_dispatch.
name: Incident Copilot CI

# This workflow is designed to run tests and package the application using Maven.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Define the jobs that will run as part of this workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Define the steps to be executed in the job.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, package, and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=sayemakhtar117
          -Dsonar.projectKey=incident-copilot
          -Dsonar.host.url=https://sonarcloud.io

      - name: Build Docker image
        run: docker build --tag incident-copilot:${{ github.sha }} .

      - name: Scan Docker image
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1
          image
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          incident-copilot:${{ github.sha }}