# This workflow is triggered when a new commit/manual deploy in the repository. It uses the Incident Copilot action to automatically generate a response to the incident.
name: Incident Copilot

# This workflow is triggered when a new commit/manual deploy in the repository. It uses the Incident Copilot action to automatically generate a response to the incident.
on:
  push:
    branches:
      - main
  workflow_dispatch:

## This workflow uses the following GitHub Actions:
permissions:
  contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: checkout repository
              uses: actions/checkout@4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 21
                cache: maven
            - name: Test and Package
              run: mvn --batch-mode-verify